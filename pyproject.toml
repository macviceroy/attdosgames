[project]
name = "att-dos-games"
version = "0.2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "espeakng-loader==0.2.4",
    "fastapi==0.115.12",
    "google-api-python-client==2.182.0",
    "pillow==11.2.1",
    "uvicorn==0.34.2",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==8.3.5",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["attgames", "attpublish"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.hatch.build.targets.wheel.force-include]
"brand" = "brand"

[project.scripts]
attgames = "attgames.__main__:main"

attpublish = "attpublish.__main__:main"
