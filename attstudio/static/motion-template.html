<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><style>
@font-face{font-family:AttLocal;src:url('font.ttf')}*{box-sizing:border-box}body{margin:0;width:1080px;height:1920px;background:#0b0b14;color:white;font-family:AttLocal}#root{position:relative;width:1080px;height:1920px;overflow:hidden}#glow{position:absolute;inset:0;background:radial-gradient(circle at 65% 40%,#a100ff66,transparent 55%)}#card{position:absolute;left:90px;right:140px;top:650px;border-left:8px solid #ff007a;padding:40px;font-size:86px;line-height:1.15;animation:enter .7s ease-out both}small{font-size:28px;letter-spacing:6px;color:#00e5ff;display:block;margin-bottom:30px}footer{position:absolute;left:130px;bottom:500px;font-size:32px;color:#00e5ff}@keyframes enter{from{transform:translateY(90px);opacity:0;filter:blur(8px)}to{transform:translateY(0);opacity:1;filter:blur(0)}}#line{position:absolute;top:1150px;left:130px;width:500px;height:8px;background:#00e5ff;animation:line 2s ease-out both}@keyframes line{from{width:0}to{width:500px}}
</style></head><body><div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1080" data-height="1920" data-no-timeline><div id="glow"></div><div id="card"><small>ATT DOS GAMES</small>SEU PRÓXIMO<br>SHORT.</div><div id="line"></div><footer>@attdosgames</footer></div></body></html>
